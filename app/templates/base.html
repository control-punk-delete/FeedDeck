<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>
    <!-- You can link your global CSS here -->
</head>
<body>

    <nav>
        <!-- Note how url_for uses the 'blueprint.route_function' format -->
        <a href="{{ url_for('main.index') }}">Home</a> | 
        <a href="{{ url_for('auth.login') }}">Login</a>
    </nav>

    <hr>

    <main>
        <!-- Child templates will inject their unique content here -->
        {% block content %}{% endblock %}
    </main>

</body>
</html>
